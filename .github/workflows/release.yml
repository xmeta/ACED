name: scwbs release artifact

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and checkout exact release subject
        id: subject
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          integrity_script="$RUNNER_TEMP/release-integrity.mjs"
          cp scripts/release-integrity.mjs "$integrity_script"
          printf 'RELEASE_INTEGRITY_SCRIPT=%s\n' "$integrity_script" >> "$GITHUB_ENV"
          git fetch origin main --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
            test -n "$tag_commit"
            git checkout --detach "$tag_commit"
            release_commit="$tag_commit"
            tag_exists=true
          else
            release_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
            checkout_commit="$(git rev-parse HEAD^{commit})"
            test "$checkout_commit" = "$release_commit"
            tag_commit=""
            tag_exists=false
          fi
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'tag_commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'tag_exists=%s\n' "$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Validate release subject, package version, and changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.subject.outputs.release_commit }}
          TAG_COMMIT: ${{ steps.subject.outputs.tag_commit }}
          TAG_EXISTS: ${{ steps.subject.outputs.tag_exists }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const { assertChangelogVersion, assertReleaseSubject } = await import(process.env.RELEASE_INTEGRITY_SCRIPT);

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const checkoutCommit = execFileSync("git", ["rev-parse", "HEAD^{commit}"], { encoding: "utf8" }).trim();
          assertReleaseSubject({
            releaseTag: process.env.RELEASE_TAG,
            packageVersion: packageJson.version,
            tagExists: process.env.TAG_EXISTS === "true",
            tagCommit: process.env.TAG_COMMIT || null,
            releaseCommit: process.env.RELEASE_COMMIT,
            checkoutCommit
          });
          assertChangelogVersion(readFileSync("CHANGELOG.md", "utf8"), packageJson.version);
          console.log(`validated release subject ${process.env.RELEASE_COMMIT} for ${process.env.RELEASE_TAG}`);
          NODE

      - name: Verify exact-head aggregate validation
        id: validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_COMMIT: ${{ steps.subject.outputs.release_commit }}
        with:
          script: |
            const { findTrustedValidationRun } = await import(process.env.RELEASE_INTEGRITY_SCRIPT);
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_COMMIT,
              per_page: 100
            });
            const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "scwbs.yml",
              head_sha: process.env.RELEASE_COMMIT,
              per_page: 100
            });
            const trusted = findTrustedValidationRun({
              checkRuns,
              workflowRuns,
              subjectCommit: process.env.RELEASE_COMMIT
            });
            if (!trusted) {
              core.setFailed(`No successful exact-head aggregate validation was found for ${process.env.RELEASE_COMMIT}`);
            } else {
              core.setOutput("workflow_run_id", String(trusted.workflowRunId));
              core.setOutput("checks", JSON.stringify(trusted.checks));
              core.info(`trusted scwbs validation workflow run ${trusted.workflowRunId}`);
            }

      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24

      - name: Build and pack self-contained artifact
        id: pack
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.subject.outputs.release_commit }}
          VALIDATION_WORKFLOW_RUN_ID: ${{ steps.validation.outputs.workflow_run_id }}
          VALIDATION_CHECKS: ${{ steps.validation.outputs.checks }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scwbs-release"
          npm pack --json --pack-destination "$RUNNER_TEMP/scwbs-release" > "$RUNNER_TEMP/scwbs-release/pack-metadata.json"
          RELEASE_DIR="$RUNNER_TEMP/scwbs-release" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, copyFileSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const { assertCliVersion, createReleaseManifest } = await import(process.env.RELEASE_INTEGRITY_SCRIPT);

          const releaseDir = process.env.RELEASE_DIR;
          const packMetadata = JSON.parse(readFileSync(path.join(releaseDir, "pack-metadata.json"), "utf8"));
          const packageEntry = packMetadata[0];
          const tarballPath = path.join(releaseDir, packageEntry.filename);
          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const cliVersion = execFileSync(process.execPath, ["dist/cli.js", "--version"], { encoding: "utf8" }).trim();
          assertCliVersion(cliVersion, packageVersion);
          const releaseManifest = createReleaseManifest({
            packageVersion,
            releaseTag: process.env.RELEASE_TAG,
            commit: process.env.RELEASE_COMMIT,
            tarballPath,
            packMetadata,
            validationWorkflowRunId: Number(process.env.VALIDATION_WORKFLOW_RUN_ID),
            validationChecks: JSON.parse(process.env.VALIDATION_CHECKS)
          });
          const manifestPath = path.join(releaseDir, "release-manifest.json");
          const bootstrapPath = path.join(releaseDir, "scwbs-bootstrap.mjs");
          copyFileSync("scripts/scwbs-bootstrap.mjs", bootstrapPath);
          writeFileSync(manifestPath, `${JSON.stringify(releaseManifest, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarballPath}\nmanifest=${manifestPath}\nbootstrap=${bootstrapPath}\n`);
          NODE

      - name: Create GitHub Release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.subject.outputs.release_commit }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_MANIFEST: ${{ steps.pack.outputs.manifest }}
          BOOTSTRAP: ${{ steps.pack.outputs.bootstrap }}
        run: gh release create "$RELEASE_TAG" "$TARBALL" "$RELEASE_MANIFEST" "$BOOTSTRAP" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "scwbs $RELEASE_TAG" --generate-notes
