name: scwbs

env:
  NODE_VERSION: 24

permissions:
  contents: read
  checks: read
  actions: read

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  plan:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.final.outputs.mode }}
      task_id: ${{ steps.final.outputs.task_id }}
      subject: ${{ steps.final.outputs.subject }}
      head_commit: ${{ steps.final.outputs.head_commit }}
      base_commit: ${{ steps.final.outputs.base_commit }}
      diff_hash: ${{ steps.final.outputs.diff_hash }}
      authority_fingerprint: ${{ steps.final.outputs.authority_fingerprint }}
      trusted_commit: ${{ steps.final.outputs.trusted_commit }}
      trusted_workflow_run_id: ${{ steps.final.outputs.trusted_workflow_run_id }}
      trusted_checks: ${{ steps.final.outputs.trusted_checks }}
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
      - name: Restore branch identity and base reference
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git switch -C "$CI_BRANCH" HEAD
          git fetch origin main:refs/remotes/origin/main
      - name: Build structural CI plan
        id: candidate
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npm run --silent scwbs -- ci plan --branch "$CI_BRANCH" --base origin/main --json > "$RUNNER_TEMP/ci-plan-candidate.json"
          node -e 'const p=require(`${process.env.RUNNER_TEMP}/ci-plan-candidate.json`); const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `decision=${p.decision}\ntask_id=${p.taskId ?? ""}\nsubject=${p.subjectHeadCommit ?? ""}\n`)'
      - name: Verify successful full CI for implementation subject
        id: subject-checks
        if: steps.candidate.outputs.decision == 'metadata-candidate'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUBJECT: ${{ steps.candidate.outputs.subject }}
          CANDIDATE_FILE: ${{ runner.temp }}/ci-plan-candidate.json
        with:
          script: |
            const fs = require("fs");
            const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE, "utf8"));
            const required = ["core", "integration", "wjs", "distribution", "validate"];
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const runIdFrom = (url) => Number(/\/actions\/runs\/(\d+)/.exec(url ?? "")?.[1] ?? 0) || null;
            const commits = Array.from(new Set([
              ...(candidate.metadataAncestry ?? []).map((entry) => entry.sha),
              candidate.subjectHeadCommit
            ].filter(Boolean)));
            const inspectCommit = async (commit) => {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit,
                per_page: 100
              });
              const groups = new Map();
              let pending = false;
              for (const check of checks.filter((item) => required.includes(item.name) && item.app?.slug === "github-actions")) {
                const runId = runIdFrom(check.details_url);
                if (!runId) continue;
                if (check.status !== "completed") pending = true;
                const group = groups.get(runId) ?? new Map();
                group.set(check.name, check);
                groups.set(runId, group);
              }
              for (const [runId, group] of [...groups.entries()].sort((left, right) => right[0] - left[0])) {
                if (!required.every((name) => group.has(name))) continue;
                const selected = required.map((name) => group.get(name));
                const workflowRun = (await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                })).data;
                const subjectHeadMatches = workflowRun?.head_sha === process.env.SUBJECT;
                const trustedRun = workflowRun?.path === ".github/workflows/scwbs.yml"
                  && (commit === process.env.SUBJECT ? subjectHeadMatches : workflowRun?.head_sha === commit)
                  && workflowRun?.id === runId
                  && workflowRun?.conclusion === "success";
                if (trustedRun && selected.every((run) => run.conclusion === "success")) {
                  return {
                    commit,
                    workflowRunId: runId,
                    checks: selected.map((run) => ({
                      id: run.id,
                      name: run.name,
                      conclusion: run.conclusion,
                      detailsUrl: run.details_url,
                      workflowRunId: workflowRun.id,
                      workflowPath: workflowRun.path
                    }))
                  };
                }
              }
              return { pending, trusted: null };
            };
            let trusted = null;
            let pending = false;
            for (let attempt = 0; attempt < 12 && !trusted; attempt += 1) {
              pending = false;
              for (const commit of commits) {
                const result = await inspectCommit(commit);
                if (result.commit) {
                  trusted = result;
                  break;
                }
                pending ||= result.pending;
              }
              if (trusted || !pending || attempt >= 11) break;
              await sleep(10000);
            }
            core.setOutput("eligible", String(Boolean(trusted)));
            core.setOutput("trusted_commit", trusted?.commit ?? "");
            core.setOutput("trusted_workflow_run_id", trusted?.workflowRunId ? String(trusted.workflowRunId) : "");
            core.setOutput("checks", JSON.stringify(trusted?.checks ?? []));
      - name: Finalize auditable CI plan
        id: final
        env:
          SUBJECT_CHECKS_ELIGIBLE: ${{ steps.subject-checks.outputs.eligible }}
          SUBJECT_CHECKS_JSON: ${{ steps.subject-checks.outputs.checks }}
          TRUSTED_COMMIT: ${{ steps.subject-checks.outputs.trusted_commit }}
          TRUSTED_WORKFLOW_RUN_ID: ${{ steps.subject-checks.outputs.trusted_workflow_run_id }}
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const candidate = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/ci-plan-candidate.json`, "utf8"));
          const parseJson = (value, fallback) => {
            try { return value ? JSON.parse(value) : fallback; } catch { return fallback; }
          };
          const gitFiles = (args) => execFileSync("git", args, { encoding: "utf8" })
            .split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
          const isAncestor = (ancestor, descendant) => {
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", ancestor, descendant], { stdio: "ignore" });
              return true;
            } catch { return false; }
          };
          const diffHash = (from, to) => {
            const diff = execFileSync("git", [
              "diff", "--binary", "--no-ext-diff", `${from}...${to}`, "--", ".",
              ...candidate.metadataFiles.map((file) => `:(exclude)${file}`)
            ]);
            return `sha256:${crypto.createHash("sha256").update(diff).digest("hex")}`;
          };
          const trustedCommit = process.env.TRUSTED_COMMIT || null;
          const trustedWorkflowRunId = Number(process.env.TRUSTED_WORKFLOW_RUN_ID) || null;
          const trustedChecks = parseJson(process.env.SUBJECT_CHECKS_JSON, []);
          const rangeIssues = [];
          let trustedRanges = null;
          if (process.env.SUBJECT_CHECKS_ELIGIBLE === "true" && trustedCommit) {
            const subjectToTrustedFiles = gitFiles(["diff", "--name-only", `${candidate.subjectHeadCommit}..${trustedCommit}`]);
            const trustedToHeadFiles = gitFiles(["diff", "--name-only", `${trustedCommit}..${candidate.headCommit}`]);
            const metadataOnly = (files) => files.every((file) => candidate.metadataFiles.includes(file));
            trustedRanges = {
              subjectToTrusted: {
                from: candidate.subjectHeadCommit,
                to: trustedCommit,
                changedFiles: subjectToTrustedFiles,
                metadataOnly: metadataOnly(subjectToTrustedFiles)
              },
              trustedToHead: {
                from: trustedCommit,
                to: candidate.headCommit,
                changedFiles: trustedToHeadFiles,
                metadataOnly: metadataOnly(trustedToHeadFiles)
              }
            };
            if (!isAncestor(candidate.subjectHeadCommit, trustedCommit) || !isAncestor(trustedCommit, candidate.headCommit)) {
              rangeIssues.push({ code: "ci.trustedCommit.ancestry.mismatch", message: "Trusted commit is not between the implementation subject and current head" });
            }
            if (!trustedRanges.subjectToTrusted.metadataOnly || !trustedRanges.trustedToHead.metadataOnly) {
              rangeIssues.push({ code: "ci.trustedCommit.nonMetadataRange", message: "Trusted commit ranges contain a non-metadata file" });
            }
            try {
              if (diffHash(candidate.baseCommit, trustedCommit) !== candidate.diffHash) {
                rangeIssues.push({ code: "ci.trustedCommit.diffHash.mismatch", message: "Trusted commit implementation diffHash does not match the Evidence diffHash" });
              }
            } catch (error) {
              rangeIssues.push({ code: "ci.trustedCommit.diffHash.failed", message: error instanceof Error ? error.message : String(error) });
            }
          }
          const verified = candidate.decision === "metadata-candidate"
            && process.env.SUBJECT_CHECKS_ELIGIBLE === "true"
            && Boolean(trustedCommit)
            && Boolean(trustedWorkflowRunId)
            && rangeIssues.length === 0;
          const fallbackReasons = candidate.decision === "full"
            ? candidate.reasons
            : verified
              ? []
              : [...candidate.reasons, ...rangeIssues, {
                  code: "ci.trustedChecks.unverified",
                  message: "No provenance-verified successful required check set was found on a metadata-only ancestor"
                }];
          const plan = {
            ...candidate,
            mode: verified ? "metadata-fast-path" : "full",
            trustedCommit: verified ? trustedCommit : null,
            trustedWorkflowRunId: verified ? trustedWorkflowRunId : null,
            trustedChecks: verified ? trustedChecks : [],
            trustedRanges: verified ? trustedRanges : null,
            subjectFullChecks: verified ? trustedChecks : [],
            fallbackReasons,
            reasons: verified ? candidate.reasons : fallbackReasons
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ci-plan.json`, `${JSON.stringify(plan, null, 2)}\n`);
          const trustedChecksOutput = JSON.stringify(plan.trustedChecks ?? []);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `mode=${plan.mode}\ntask_id=${plan.taskId ?? ""}\nsubject=${plan.subjectHeadCommit ?? ""}\nhead_commit=${plan.headCommit ?? ""}\nbase_commit=${plan.baseCommit ?? ""}\ndiff_hash=${plan.diffHash ?? ""}\nauthority_fingerprint=${plan.authorityFingerprint ?? ""}\ntrusted_commit=${plan.trustedCommit ?? ""}\ntrusted_workflow_run_id=${plan.trustedWorkflowRunId ?? ""}\ntrusted_checks=${trustedChecksOutput}\n`);
          process.stdout.write(`${JSON.stringify(plan, null, 2)}\n`);
          NODE
      - name: Validate schemas and check coverage on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        run: npm run scwbs -- check
      - name: Validate governed diff on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        env:
          TASK_ID: ${{ steps.final.outputs.task_id }}
        run: npm run scwbs -- check-diff --task "$TASK_ID" --base origin/main
      - name: Validate registry consistency on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        run: npm run scwbs -- registry rebuild --check

  minimum-node:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0"]
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run core tests
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build

  core:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify npm workspaces
        run: npm ls --workspaces --depth=0
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Unit coverage
        run: npm run test:coverage
      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
      - name: Combined unit and integration coverage
        run: npm run test:coverage:all
      - name: Resolve implementation subject head
        id: subject
        env:
          SCWBS_TASK_ID: ${{ needs.plan.outputs.task_id }}
          SCWBS_PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
          SCWBS_BRANCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SCWBS_PULL_REQUEST" ]; then
            git fetch --no-tags --depth=1 origin "refs/pull/${SCWBS_PULL_REQUEST}/head"
          fi
          subject_head="$(git log -1 --format=%H "$SCWBS_BRANCH_HEAD" -- \
            . \
            ":(exclude)contracts/evidence/${SCWBS_TASK_ID}.yaml" \
            ":(exclude)contracts/evidence-payloads/${SCWBS_TASK_ID}.patch" \
            ":(exclude)contracts/approvals/${SCWBS_TASK_ID}.yaml" \
            ":(exclude)contracts/reviews/${SCWBS_TASK_ID}.yaml" \
            ":(exclude)contracts/registry.yaml")"
          test -n "$subject_head"
          echo "subject_head=$subject_head" >> "$GITHUB_OUTPUT"
      - name: Create coverage receipt and Evidence snapshot
        env:
          SCWBS_TASK_ID: ${{ needs.plan.outputs.task_id }}
          SCWBS_PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
          SCWBS_SUBJECT_HEAD: ${{ steps.subject.outputs.subject_head }}
          SCWBS_ARTIFACT_NAME: coverage-${{ github.sha }}
          SCWBS_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/coverage-evidence.mjs
      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Contract check
        run: npm run scwbs -- check
      - name: Contract health
        run: npm run scwbs -- health
      - name: Registry check
        run: npm run scwbs -- registry rebuild --check

  integration:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Integration tests
        run: npm run test:integration

  wjs:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: WJS tests
        run: npm run test:wjs

  distribution:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap local action checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository and Node.js toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Packed artifact standalone smoke test
        run: node scripts/distribution-smoke.mjs

  validate:
    if: ${{ github.event_name != 'workflow_run' && always() }}
    needs:
      - plan
      - core
      - integration
      - wjs
      - distribution
      - minimum-node
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CORE_RESULT: ${{ needs.core.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WJS_RESULT: ${{ needs.wjs.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          if test "$MODE" = "metadata-fast-path"; then
            test "$CORE_RESULT" = "skipped"
            test "$INTEGRATION_RESULT" = "skipped"
            test "$WJS_RESULT" = "skipped"
            test "$DISTRIBUTION_RESULT" = "skipped"
            test "$MINIMUM_NODE_RESULT" = "skipped"
          else
            test "$MODE" = "full"
            test "$CORE_RESULT" = "success"
            test "$INTEGRATION_RESULT" = "success"
            test "$WJS_RESULT" = "success"
            test "$DISTRIBUTION_RESULT" = "success"
            test "$MINIMUM_NODE_RESULT" = "success"
          fi
      - name: Create verified CI receipt and PR readiness artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCWBS_REPOSITORY: ${{ github.repository }}
          SCWBS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SCWBS_TASK_ID: ${{ needs.plan.outputs.task_id }}
          SCWBS_HEAD_COMMIT: ${{ needs.plan.outputs.head_commit }}
          SCWBS_BASE_COMMIT: ${{ needs.plan.outputs.base_commit }}
          SCWBS_DIFF_HASH: ${{ needs.plan.outputs.diff_hash }}
          SCWBS_AUTHORITY_FINGERPRINT: ${{ needs.plan.outputs.authority_fingerprint }}
          SCWBS_MODE: ${{ needs.plan.outputs.mode }}
          SCWBS_TRUSTED_COMMIT: ${{ needs.plan.outputs.trusted_commit }}
          SCWBS_TRUSTED_WORKFLOW_RUN_ID: ${{ needs.plan.outputs.trusted_workflow_run_id }}
          SCWBS_TRUSTED_CHECKS: ${{ needs.plan.outputs.trusted_checks }}
          SCWBS_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SCWBS_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCWBS_DRAFT: ${{ github.event.pull_request.draft }}
        with:
          script: |
            const fs = require("fs");
            const crypto = require("crypto");
            const workflowPath = ".github/workflows/scwbs.yml";
            const required = ["core", "integration", "wjs"];
            const trustedChecks = process.env.SCWBS_MODE === "metadata-fast-path"
              ? JSON.parse(process.env.SCWBS_TRUSTED_CHECKS || "[]")
              : [];
            const checks = trustedChecks.length > 0
              ? trustedChecks
              : await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.SCWBS_HEAD_COMMIT,
                per_page: 100
              });
            const receiptWorkflowRunId = process.env.SCWBS_MODE === "metadata-fast-path"
              ? process.env.SCWBS_TRUSTED_WORKFLOW_RUN_ID
              : process.env.SCWBS_WORKFLOW_RUN_ID;
            const receiptWorkflowRunUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.SCWBS_REPOSITORY}/actions/runs/${receiptWorkflowRunId}`;
            const jobs = required.map((name) => {
              const check = checks.find((candidate) => candidate.name === name && (candidate.app?.slug === "github-actions" || candidate.workflowPath === ".github/workflows/scwbs.yml") && candidate.conclusion === "success");
              if (!check) throw new Error(`missing successful ${name} check for the implementation subject`);
              return {
                name,
                checkNames: name === "core" ? ["test", "typecheck", "build"] : name === "integration" ? ["test:integration"] : [],
                jobId: String(check.id),
                conclusion: "success",
                url: check.details_url ?? check.detailsUrl ?? receiptWorkflowRunUrl,
                workflowRunId: receiptWorkflowRunId,
                workflowPath
              };
            });
            jobs.push({
              name: "validate",
              checkNames: [],
              jobId: `${process.env.SCWBS_WORKFLOW_RUN_ID}-validate`,
              conclusion: "success",
              url: receiptWorkflowRunUrl,
              workflowRunId: receiptWorkflowRunId,
              workflowPath
            });
            const ciReceipt = {
              schemaVersion: "1.0.0",
              repository: process.env.SCWBS_REPOSITORY,
              pullRequest: process.env.SCWBS_PULL_REQUEST,
              taskId: process.env.SCWBS_TASK_ID,
              headCommit: process.env.SCWBS_HEAD_COMMIT,
              baseRef: "origin/main",
              baseCommit: process.env.SCWBS_BASE_COMMIT,
              diffHash: process.env.SCWBS_DIFF_HASH,
              authorityFingerprint: process.env.SCWBS_AUTHORITY_FINGERPRINT,
              workflowPath,
              workflowRunId: receiptWorkflowRunId,
              workflowRunUrl: receiptWorkflowRunUrl,
              trustedCommit: process.env.SCWBS_TRUSTED_COMMIT || process.env.SCWBS_HEAD_COMMIT,
              retrievedAt: new Date().toISOString(),
              verifiedBy: "github-actions-provenance",
              jobs
            };
            const ciBytes = Buffer.from(`${JSON.stringify(ciReceipt, null, 2)}\n`, "utf8");
            const artifactName = `scwbs-ci-receipt-${process.env.SCWBS_WORKFLOW_RUN_ID}`;
            const readiness = {
              schemaVersion: "1.0.0",
              type: "scwbs.pr-readiness.v1",
              repository: process.env.SCWBS_REPOSITORY,
              pullRequest: process.env.SCWBS_PULL_REQUEST,
              taskId: process.env.SCWBS_TASK_ID,
              headCommit: process.env.SCWBS_HEAD_COMMIT,
              baseRef: "origin/main",
              baseCommit: process.env.SCWBS_BASE_COMMIT,
              diffHash: process.env.SCWBS_DIFF_HASH,
              authorityFingerprint: process.env.SCWBS_AUTHORITY_FINGERPRINT,
              workflowPath,
              workflowRunId: process.env.SCWBS_WORKFLOW_RUN_ID,
              workflowRunUrl: process.env.SCWBS_WORKFLOW_RUN_URL,
              artifactName,
              artifactDigest: `sha256:${crypto.createHash("sha256").update(ciBytes).digest("hex")}`,
              validateStatus: "success",
              nextAction: process.env.SCWBS_DRAFT === "true"
                ? { owner: "human", kind: "guidance", message: "Mark the pull request ready for review before protected merge." }
                : { owner: "human", kind: "guidance", message: "Review Evidence and Approval state, then use the protected scwbs merge command." },
              mergeReadiness: {
                status: process.env.SCWBS_DRAFT === "true" ? "not-ready" : "ready",
                reasonCodes: process.env.SCWBS_DRAFT === "true" ? ["pr.draft"] : []
              },
              generatedAt: new Date().toISOString()
            };
            fs.writeFileSync("ci-receipt.json", ciBytes);
            fs.writeFileSync("pr-readiness.json", `${JSON.stringify(readiness, null, 2)}\n`);
      - name: Upload verified CI readiness artifact
        if: ${{ github.event_name == 'pull_request' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scwbs-readiness-${{ github.run_id }}
          path: |
            ci-receipt.json
            pr-readiness.json
          if-no-files-found: error
