name: scwbs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify npm workspaces
        run: npm ls --workspaces --depth=0
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Contract check
        run: npm run scwbs -- check
      - name: Contract health
        run: npm run scwbs -- health
      - name: Registry check
        run: npm run scwbs -- registry rebuild --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Integration tests
        run: npm run test:integration

  wjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: WJS tests
        run: npm run test:wjs

  validate:
    if: ${{ always() }}
    needs:
      - core
      - integration
      - wjs
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WJS_RESULT: ${{ needs.wjs.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$WJS_RESULT" = "success"
