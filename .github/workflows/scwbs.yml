name: scwbs

env:
  NODE_VERSION: 24

permissions:
  contents: read
  checks: read
  actions: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.final.outputs.mode }}
      task_id: ${{ steps.final.outputs.task_id }}
      subject: ${{ steps.final.outputs.subject }}
    steps:
      - name: Checkout exact head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Restore branch identity and base reference
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git switch -C "$CI_BRANCH" HEAD
          git fetch origin main:refs/remotes/origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Enable Corepack and report toolchain
        run: |
          npm install --global corepack@latest
          corepack enable
          node --version
          corepack npm --version
      - name: Install dependencies
        run: corepack npm ci --no-audit --no-fund
      - name: Build structural CI plan
        id: candidate
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npm run --silent scwbs -- ci plan --branch "$CI_BRANCH" --base origin/main --json > "$RUNNER_TEMP/ci-plan-candidate.json"
          node -e 'const p=require(`${process.env.RUNNER_TEMP}/ci-plan-candidate.json`); const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `decision=${p.decision}\ntask_id=${p.taskId ?? ""}\nsubject=${p.subjectHeadCommit ?? ""}\n`)'
      - name: Verify successful full CI for implementation subject
        id: subject-checks
        if: steps.candidate.outputs.decision == 'metadata-candidate'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUBJECT: ${{ steps.candidate.outputs.subject }}
          CANDIDATE_FILE: ${{ runner.temp }}/ci-plan-candidate.json
        with:
          script: |
            const fs = require("fs");
            const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE, "utf8"));
            const required = ["core", "integration", "wjs", "validate"];
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const runIdFrom = (url) => Number(/\/actions\/runs\/(\d+)/.exec(url ?? "")?.[1] ?? 0) || null;
            const commits = Array.from(new Set([
              ...(candidate.metadataAncestry ?? []).map((entry) => entry.sha),
              candidate.subjectHeadCommit
            ].filter(Boolean)));
            const inspectCommit = async (commit) => {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit,
                per_page: 100
              });
              const groups = new Map();
              let pending = false;
              for (const check of checks.filter((item) => required.includes(item.name) && item.app?.slug === "github-actions")) {
                const runId = runIdFrom(check.details_url);
                if (!runId) continue;
                if (check.status !== "completed") pending = true;
                const group = groups.get(runId) ?? new Map();
                group.set(check.name, check);
                groups.set(runId, group);
              }
              for (const [runId, group] of [...groups.entries()].sort((left, right) => right[0] - left[0])) {
                if (!required.every((name) => group.has(name))) continue;
                const selected = required.map((name) => group.get(name));
                const workflowRun = (await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                })).data;
                const subjectHeadMatches = workflowRun?.head_sha === process.env.SUBJECT;
                const trustedRun = workflowRun?.path === ".github/workflows/scwbs.yml"
                  && (commit === process.env.SUBJECT ? subjectHeadMatches : workflowRun?.head_sha === commit)
                  && workflowRun?.id === runId
                  && workflowRun?.conclusion === "success";
                if (trustedRun && selected.every((run) => run.conclusion === "success")) {
                  return {
                    commit,
                    workflowRunId: runId,
                    checks: selected.map((run) => ({
                      id: run.id,
                      name: run.name,
                      conclusion: run.conclusion,
                      detailsUrl: run.details_url,
                      workflowRunId: workflowRun.id,
                      workflowPath: workflowRun.path
                    }))
                  };
                }
              }
              return { pending, trusted: null };
            };
            let trusted = null;
            let pending = false;
            for (let attempt = 0; attempt < 12 && !trusted; attempt += 1) {
              pending = false;
              for (const commit of commits) {
                const result = await inspectCommit(commit);
                if (result.commit) {
                  trusted = result;
                  break;
                }
                pending ||= result.pending;
              }
              if (trusted || !pending || attempt >= 11) break;
              await sleep(10000);
            }
            core.setOutput("eligible", String(Boolean(trusted)));
            core.setOutput("trusted_commit", trusted?.commit ?? "");
            core.setOutput("trusted_workflow_run_id", trusted?.workflowRunId ? String(trusted.workflowRunId) : "");
            core.setOutput("checks", JSON.stringify(trusted?.checks ?? []));
      - name: Finalize auditable CI plan
        id: final
        env:
          SUBJECT_CHECKS_ELIGIBLE: ${{ steps.subject-checks.outputs.eligible }}
          SUBJECT_CHECKS_JSON: ${{ steps.subject-checks.outputs.checks }}
          TRUSTED_COMMIT: ${{ steps.subject-checks.outputs.trusted_commit }}
          TRUSTED_WORKFLOW_RUN_ID: ${{ steps.subject-checks.outputs.trusted_workflow_run_id }}
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const candidate = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/ci-plan-candidate.json`, "utf8"));
          const parseJson = (value, fallback) => {
            try { return value ? JSON.parse(value) : fallback; } catch { return fallback; }
          };
          const gitFiles = (args) => execFileSync("git", args, { encoding: "utf8" })
            .split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
          const isAncestor = (ancestor, descendant) => {
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", ancestor, descendant], { stdio: "ignore" });
              return true;
            } catch { return false; }
          };
          const diffHash = (from, to) => {
            const diff = execFileSync("git", [
              "diff", "--binary", "--no-ext-diff", `${from}...${to}`, "--", ".",
              ...candidate.metadataFiles.map((file) => `:(exclude)${file}`)
            ]);
            return `sha256:${crypto.createHash("sha256").update(diff).digest("hex")}`;
          };
          const trustedCommit = process.env.TRUSTED_COMMIT || null;
          const trustedWorkflowRunId = Number(process.env.TRUSTED_WORKFLOW_RUN_ID) || null;
          const trustedChecks = parseJson(process.env.SUBJECT_CHECKS_JSON, []);
          const rangeIssues = [];
          let trustedRanges = null;
          if (process.env.SUBJECT_CHECKS_ELIGIBLE === "true" && trustedCommit) {
            const subjectToTrustedFiles = gitFiles(["diff", "--name-only", `${candidate.subjectHeadCommit}..${trustedCommit}`]);
            const trustedToHeadFiles = gitFiles(["diff", "--name-only", `${trustedCommit}..${candidate.headCommit}`]);
            const metadataOnly = (files) => files.every((file) => candidate.metadataFiles.includes(file));
            trustedRanges = {
              subjectToTrusted: {
                from: candidate.subjectHeadCommit,
                to: trustedCommit,
                changedFiles: subjectToTrustedFiles,
                metadataOnly: metadataOnly(subjectToTrustedFiles)
              },
              trustedToHead: {
                from: trustedCommit,
                to: candidate.headCommit,
                changedFiles: trustedToHeadFiles,
                metadataOnly: metadataOnly(trustedToHeadFiles)
              }
            };
            if (!isAncestor(candidate.subjectHeadCommit, trustedCommit) || !isAncestor(trustedCommit, candidate.headCommit)) {
              rangeIssues.push({ code: "ci.trustedCommit.ancestry.mismatch", message: "Trusted commit is not between the implementation subject and current head" });
            }
            if (!trustedRanges.subjectToTrusted.metadataOnly || !trustedRanges.trustedToHead.metadataOnly) {
              rangeIssues.push({ code: "ci.trustedCommit.nonMetadataRange", message: "Trusted commit ranges contain a non-metadata file" });
            }
            try {
              if (diffHash(candidate.baseCommit, trustedCommit) !== candidate.diffHash) {
                rangeIssues.push({ code: "ci.trustedCommit.diffHash.mismatch", message: "Trusted commit implementation diffHash does not match the Evidence diffHash" });
              }
            } catch (error) {
              rangeIssues.push({ code: "ci.trustedCommit.diffHash.failed", message: error instanceof Error ? error.message : String(error) });
            }
          }
          const verified = candidate.decision === "metadata-candidate"
            && process.env.SUBJECT_CHECKS_ELIGIBLE === "true"
            && Boolean(trustedCommit)
            && Boolean(trustedWorkflowRunId)
            && rangeIssues.length === 0;
          const fallbackReasons = candidate.decision === "full"
            ? candidate.reasons
            : verified
              ? []
              : [...candidate.reasons, ...rangeIssues, {
                  code: "ci.trustedChecks.unverified",
                  message: "No provenance-verified successful required check set was found on a metadata-only ancestor"
                }];
          const plan = {
            ...candidate,
            mode: verified ? "metadata-fast-path" : "full",
            trustedCommit: verified ? trustedCommit : null,
            trustedWorkflowRunId: verified ? trustedWorkflowRunId : null,
            trustedChecks: verified ? trustedChecks : [],
            trustedRanges: verified ? trustedRanges : null,
            subjectFullChecks: verified ? trustedChecks : [],
            fallbackReasons,
            reasons: verified ? candidate.reasons : fallbackReasons
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ci-plan.json`, `${JSON.stringify(plan, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `mode=${plan.mode}\ntask_id=${plan.taskId ?? ""}\nsubject=${plan.subjectHeadCommit ?? ""}\n`);
          process.stdout.write(`${JSON.stringify(plan, null, 2)}\n`);
          NODE
      - name: Validate schemas and check coverage on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        run: npm run scwbs -- check
      - name: Validate governed diff on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        env:
          TASK_ID: ${{ steps.final.outputs.task_id }}
        run: npm run scwbs -- check-diff --task "$TASK_ID" --base origin/main
      - name: Validate registry consistency on metadata fast path
        if: steps.final.outputs.mode == 'metadata-fast-path'
        run: npm run scwbs -- registry rebuild --check

  minimum-node:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Enable Corepack and report toolchain
        run: |
          npm install --global corepack@latest
          corepack enable
          node --version
          corepack npm --version
      - name: Install dependencies and run core tests
        run: |
          corepack npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run typecheck
          npm run build

  core:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Enable Corepack and report toolchain
        run: |
          npm install --global corepack@latest
          corepack enable
          node --version
          corepack npm --version
      - name: Install dependencies
        run: corepack npm ci --no-audit --no-fund
      - name: Verify npm workspaces
        run: npm ls --workspaces --depth=0
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Combined unit and integration coverage
        run: npm run test:coverage:all
      - name: Create coverage receipt and Evidence snapshot
        env:
          SCWBS_TASK_ID: ${{ needs.plan.outputs.task_id }}
          SCWBS_PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
          SCWBS_SUBJECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCWBS_ARTIFACT_NAME: coverage-${{ github.sha }}
          SCWBS_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/coverage-evidence.mjs
      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Contract check
        run: npm run scwbs -- check
      - name: Contract health
        run: npm run scwbs -- health
      - name: Registry check
        run: npm run scwbs -- registry rebuild --check

  integration:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Enable Corepack and report toolchain
        run: |
          npm install --global corepack@latest
          corepack enable
          node --version
          corepack npm --version
      - name: Install dependencies
        run: corepack npm ci --no-audit --no-fund
      - name: Integration tests
        run: npm run test:integration

  wjs:
    needs: plan
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Enable Corepack and report toolchain
        run: |
          npm install --global corepack@latest
          corepack enable
          node --version
          corepack npm --version
      - name: Install dependencies
        run: corepack npm ci --no-audit --no-fund
      - name: WJS tests
        run: npm run test:wjs

  validate:
    if: ${{ always() }}
    needs:
      - plan
      - core
      - integration
      - wjs
      - minimum-node
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CORE_RESULT: ${{ needs.core.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WJS_RESULT: ${{ needs.wjs.result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          if test "$MODE" = "metadata-fast-path"; then
            test "$CORE_RESULT" = "skipped"
            test "$INTEGRATION_RESULT" = "skipped"
            test "$WJS_RESULT" = "skipped"
            test "$MINIMUM_NODE_RESULT" = "skipped"
          else
            test "$MODE" = "full"
            test "$CORE_RESULT" = "success"
            test "$INTEGRATION_RESULT" = "success"
            test "$WJS_RESULT" = "success"
            test "$MINIMUM_NODE_RESULT" = "success"
          fi
