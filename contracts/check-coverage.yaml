implementationRoots:
  - src/commands
  - src/core
  - src/cli
rules:
  - id: wjs-tests
    classification: behavior-critical
    rationale: WJS changes are validated by the dedicated WJS suite.
    paths:
      - wjs
      - wjs/**
    requires:
      - test:wjs
  - id: integration-test-suite
    classification: behavior-critical
    rationale: Integration tests exercise CLI workflows and must run when their assertions change.
    paths:
      - tests/integration/**
    requires:
      - test:integration
  - id: command-workflow-integration
    classification: behavior-critical
    rationale: Every CLI command can alter or validate repository workflow state, so each command requires integration coverage.
    paths:
      - src/commands/ai-packet.ts
      - src/commands/ai-queue.ts
      - src/commands/ai-run.ts
      - src/commands/approval-request.ts
      - src/commands/approval-delegation.ts
      - src/commands/check-diff.ts
      - src/commands/check.ts
      - src/commands/checks-run.ts
      - src/commands/ci-plan.ts
      - src/commands/completion.ts
      - src/commands/doctor.ts
      - src/commands/docs-check.ts
      - src/commands/discovery.ts
      - src/commands/evidence-annotate.ts
      - src/commands/evidence-collect.ts
      - src/commands/finish.ts
      - src/commands/fix.ts
      - src/commands/health.ts
      - src/commands/init.ts
      - src/commands/intake.ts
      - src/commands/lite.ts
      - src/commands/metrics.ts
      - src/commands/merge.ts
      - src/commands/mcp.ts
      - src/commands/local-index.ts
      - src/commands/query.ts
      - src/commands/risk.ts
      - src/commands/next.ts
      - src/commands/plan.ts
      - src/commands/pack.ts
      - src/commands/profile.ts
      - src/commands/registry-rebuild.ts
      - src/commands/review-queue.ts
      - src/commands/review-request.ts
      - src/commands/start.ts
      - src/commands/status.ts
      - src/commands/task-generate.ts
      - src/commands/task-index.ts
      - src/commands/task-lock.ts
      - src/commands/task-new.ts
      - src/commands/task-refresh.ts
      - src/commands/trace.ts
      - src/commands/ui.ts
      - src/commands/version.ts
      - src/commands/wbs.ts
    requires:
      - test:integration
  - id: cli-registration-integration
    classification: behavior-critical
    rationale: Domain registration modules define the public CLI command tree and require integration coverage.
    paths:
      - src/cli/**
    requires:
      - test:integration
  - id: core-workflow-safety-integration
    classification: behavior-critical
    rationale: These modules implement Git, Evidence, Approval, Human Gate, Registry, Contract Lock, parsing, path, and WBS enforcement used across CLI workflows.
    paths:
      - src/core/check-cache.ts
      - src/core/check-catalog.ts
      - src/core/check-output-summary.ts
      - src/core/check-receipt.ts
      - src/core/check-coverage.ts
      - src/core/agent-adapters.ts
      - src/core/approval-version.ts
      - src/core/packs.ts
      - src/core/ci-plan-domain.ts
      - src/core/code-context.ts
      - src/core/document-lifecycle.ts
      - src/core/discovery.ts
      - src/core/distribution.ts
      - src/core/planning.ts
      - src/core/contracts.ts
      - src/core/git.ts
      - src/core/finish-lifecycle.ts
      - src/core/github-actions.ts
      - src/core/github-pull-requests.ts
      - src/core/glob.ts
      - src/core/governance-path-policy.ts
      - src/core/governance-warning-budget.ts
      - src/core/hash.ts
      - src/core/human-gate.ts
      - src/core/health-domain.ts
      - src/core/health-lifecycle.ts
      - src/core/json.ts
      - src/core/managed-contract-paths.ts
      - src/core/mcp.ts
      - src/core/local-index.ts
      - src/core/merge-preflight.ts
      - src/core/node-utils.ts
      - src/core/paths.ts
      - src/core/report.ts
      - src/core/risk.ts
      - src/core/required-check-run.ts
      - src/core/schema.ts
      - src/core/schema/check-coverage.ts
      - src/core/schema/contracts.ts
      - src/core/schema/discovery.ts
      - src/core/schema/index.ts
      - src/core/schema/records.ts
      - src/core/schema/registries.ts
      - src/core/schema/shared.ts
      - src/core/schema/wbs.ts
      - src/core/submodule-provenance.ts
      - src/core/task-authority.ts
      - src/core/task-index.ts
      - src/core/task-wbs-policy.ts
      - src/core/metrics-domain.ts
      - src/core/wbs-lock.ts
      - src/core/wbs.ts
      - src/core/yaml.ts
      - src/core/evidence/build.ts
      - src/core/evidence/ci-receipt.ts
      - src/core/evidence/coverage-receipt.ts
      - src/core/evidence/test-quality-observation.ts
      - src/core/attestation.ts
      - src/core/serve.ts
      - src/core/github-issue.ts
      - src/core/locales.ts
    requires:
      - test:integration
  - id: core-types-unit-only
    classification: unit-only
    rationale: Shared TypeScript declarations have no runtime behavior and retain the baseline unit test requirement without forcing the integration suite.
    paths:
      - src/core/types.ts
    requires:
      - test
