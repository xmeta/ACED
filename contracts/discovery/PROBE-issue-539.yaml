id: PROBE-issue-539
type: discovery-probe
status: concluded
question: Can generated agent guidance and selected CLI messages use versioned locale bundles with deterministic fallback while preserving ja/en meaning, stable machine codes, adapter/locale orthogonality, and user-owned files?
hypotheses:
  - locale bundles can be data-driven without language-union growth
  - template placeholders can be validated in CI
  - ja/en meaning and stable JSON fields can remain unchanged
  - one additional locale can prove extension without authority changes
activities:
  - inspect init guidance and CLI language handling
  - define bundle and fallback schema
  - extract templates from adapters
  - add placeholder and missing-key validation
  - exercise user-owned preservation and third-locale fixture
evidenceExpected:
  - locale bundle files
  - template separation
  - ja/en regression fixtures
  - additional locale fixture
  - missing-key and placeholder checks
  - fallback and user-owned preservation tests
unknowns:
  - complete message inventory
  - template placeholder syntax
  - scope of CLI help translation
  - legacy user-owned file migration behavior
timebox: one implementation cycle
costLimit: bounded local bundle fixtures and deterministic validation
exitConditions:
  - locale schema is versioned and bounded
  - ja/en generated guidance meaning is preserved
  - stable codes and JSON fields remain locale-independent
  - missing or invalid translations fail closed
  - user-owned files are not overwritten
nextDecision: implement a versioned locale bundle schema, template and locale separation, deterministic fallback, placeholder validation, an additional locale fixture, and preservation tests under one bounded Task Contract
