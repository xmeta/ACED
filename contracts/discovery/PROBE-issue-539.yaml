factsLearned:
  - agent adapter guidance is generated through renderAgentFiles and can be separated into templates plus locale data
  - ja/en output and stable JSON fields need regression fixtures rather than translated schemas
  - missing keys and placeholder mismatches should fail closed before writing files
  - user-owned divergent files already have preservation semantics that localization must retain
  - an additional locale fixture can validate bundle extensibility without changing the Language union
hypothesesRejected:
  - translating stable JSON schema fields or error codes
  - locale-specific authority semantics
  - overwriting divergent user-owned files
  - requiring a TypeScript union change for every locale
