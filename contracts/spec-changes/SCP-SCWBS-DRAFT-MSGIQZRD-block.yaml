  - '非対話実行、自己申告だけのactor、TTY確認と実行ユーザーの不一致はfail closedとする。'
  - '変更承認後にSpec Contract、Task Contract、実装、テストを更新し、既存PRは新しいEvidenceとApprovalで再検証する。'
