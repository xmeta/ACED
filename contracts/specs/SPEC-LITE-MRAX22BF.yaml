id: SPEC-LITE-MRAX22BF
type: spec-contract
featureId: F-MRAX22BF
title: "Enforce WBS direct-edit prohibition in check-diff and check (ISSUE #106)"
status: draft
version: 0.1.0
summary: "Enforce WBS direct-edit prohibition in check-diff and check (ISSUE #106)"
acceptanceCriteria:
  - 'scwbs check and scwbs check-diff detect direct edits to contracts/wbs/project.wbs.json without a corresponding contracts/changesets/*.json'
  - 'The detection error includes a fixCommand that tells the user how to apply a changeset instead'
  - 'Direct edits accompanied by a matching changeset are still allowed'
  - 'AI-facing docs (AGENTS.md and docs/scwbs/ai-agent-guide.md) explicitly state that the WBS canonical file must not be edited directly'
