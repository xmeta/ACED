summary: "Issue #128: completion apply must not generate Human Approval records; require existing approved Approval and validate headCommit/diffHash against Evidence; reject on missing/requested/rejected/scope-mismatch; write WBS changeset only after all validations pass; use atomic write where possible"
acceptanceCriteria:
  - Approval がないタスクで completion apply --apply が失敗する
  - requested / rejected / scope不一致の Approval で失敗する
  - 有効な approved Approval がある場合だけWBSをcompletedへ更新できる
  - completion apply 実行後も Approval ファイルの内容は変更されない
  - WBS適用失敗時に新しい承認・完了状態が残らない
