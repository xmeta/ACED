acceptanceCriteria:
  - 全integration成功時の既定出力がtest件数やCLI成功出力に比例しない
  - 成功時はsuite/test counts、duration、最終statusを短いsummaryで確認できる
  - 失敗時はfailed test名、原因、再実行コマンド、bounded stdout/stderrを確認できる
  - stdout/stderrを検証する既存test assertionを維持する
  - test:integration:verboseで必要時に全ログを取得できる
  - CI integration jobが新しい既定modeでgreenになる
  - 代表suiteのline数またはbyte数上限を自動検証する
