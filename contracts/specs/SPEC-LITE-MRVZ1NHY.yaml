acceptanceCriteria:
  - WSL + Windows側TMPまたはTEMPのfixtureでLinux側/tmpへのfallbackを再現できる
  - integration runnerが実効temp pathと選択policyをbounded診断として表示する
  - 明示的なTMPDIRは上書きせず、DrvFS上ならTMPDIR=/tmpを使う具体的な再実行コマンドを表示する
  - 通常Linux、macOS、Windowsでは従来の実効tempを維持する
  - canonical、verbose、direct runnerの一時reportと子Vitestが同じ選択済み環境を使う
  - 現在のWSL環境で手動TMPDIR指定なしのfull integrationがLinux側tempを使って成功し、Issue記録の約20分より短縮する
