acceptanceCriteria:
  - WJS PR #5のmerged commitをACED submoduleで固定する
  - SC-WBS側のchangeset再現検証もsetDocumentExtensionを解釈する
  - changesetはextensions.scwbs.profileのStandardを保持し、governanceCost.warningBudgets.StandardへgovernanceFiles 700、governanceLines 31000、governanceToSourceLineRatio 2.0を設定する
