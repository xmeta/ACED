  - Every authoritative dry-run verifies historical base and subject objects, origin PR ancestry, canonical changedFiles, git-diff-binary-v1 diffHash, and untruncated output before any tracked mutation.
  - Evidence retention preserves historical checks and testQuality facts, creates reproducible patch payload provenance, and changes no source, test, documentation, WBS, changeset, or existing Task Contract.
  - Review requests are replaced only after all eight Evidence subjects are stable; AI never approves, rejects, closes, or marks changes requested.
  - Post-finish v2 Approval requests are created for the historical PR of each subject, and only human TTY approvals with exact current Evidence identity satisfy readiness.
  - "The cohort is all-or-nothing: any mismatch or human rejection blocks the migration Task and no partial migration is merged."
nonGoals:
  - Changing implementation source, tests, documentation, schemas, package configuration, CI, authentication, WBS, changesets, or Task authority.
  - Reusing SCWBS-053 or an existing node-completion changeset.
  - Performing Review or Approval decisions on behalf of a human.
  - Completing the WBS node or refreshing the 227 Task contract locks affected by a future node status transition.
