stopIf:
  - The fix requires changes outside allowedPaths
  - The fix weakens Evidence provenance, check-diff, Human Gate, or approval scope semantics
  - Atomic rollback cannot preserve both pre-existing Evidence and Registry on a failed checkpoint
requiredChecks:
  - test
  - test:integration
  - typecheck
  - build
doneCriteria:
  - failed required checkは既存の成功EvidenceとRegistryを上書きしない
  - check-diff違反はEvidenceとRegistryの永続化前に検出し、片側更新を残さない
  - Human Gate待ちはcandidate EvidenceとRegistryを同一checkpointとして保存し、awaiting-human-approvalを返す
  - Registry checkpoint失敗時はEvidenceとRegistryを両方rollbackする
  - finish --preflightはrequired checksを実行せず永続fileを変更しない
  - JSONはphase、outcome、mutatedFiles、resumeCommandを全終了経路で返す
  - integration testsはfailed check、diff violation、Human Gate、registry failure、interruption、preflight、successを終了前後のgit statusとともに検証する
  - 成功済みcheck cacheと--rerun-checksの既存挙動を維持する
  - Human Approvalとapproval scopeの既存ガードを維持する
evidenceRequired:
  - test-result
  - integration-test-result
  - typecheck-result
  - build-result
