stopIf:
  - package or lockfile change required
  - workflow change required
  - receipt cannot be bound to current subject and command provenance
requiredChecks:
  - test
  - test:integration
  - typecheck
  - build
doneCriteria:
  - scwbs checks run --taskをrequiredChecksの正規実行入口として追加し、task、subject、command、dependency、submodule provenanceをreceiptへ記録する
  - Evidence収集とfinishは現在subjectおよびresolved commandに完全一致するpassed receiptだけを再利用する
  - HEAD、差分、check command、lockfile、submodule provenanceの変化でreceiptをfail-closedに無効化する
  - failed、interrupted、staleなreceiptおよび生のnpm自己申告結果を再利用しない
  - --rerun-checksで有効なreceiptがあってもrequiredChecksを明示的に再実行できる
  - human向け出力をboundedに保ち、JSON出力で実行、再利用、無効化理由を監査できる
  - 高コストcheckがcanonical runと直後のEvidence収集を通じて一度だけ実行される回帰テストを追加する
evidenceRequired:
  - test-result
  - integration-test-result
  - typecheck-result
  - build-result
