doneCriteria:
  - 直接test:integrationとtest:integration:verboseはrepository単位のrequired-check lockを共有し、同時起動でsuiteを重複実行しない
  - finish、evidence collect、checks run配下のintegrationは親required-check leaseを検証して継承し、直接実行との競合を同じlockで検出する
  - active PID、開始時刻、mode、worker数、経過時間をbounded outputで表示する
  - PIDが存在しないstale lockを安全に回復し、正常終了、failure、signal interruptionで所有中のlockだけを解放する
  - default、verbose、JSON reportの既存stdout互換性を維持する
  - fake integration actionで重複、継承、stale lock、failure cleanupの回帰テストを追加する
  - raw Vitest直接起動は排他を迂回できる保証限界を文書化する
evidenceRequired:
  - test-result
  - integration-test-result
  - typecheck-result
  - build-result
