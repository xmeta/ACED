doneCriteria:
  - approvalPolicy未指定またはhuman-onlyのTaskではAI execution modeからapproved recordを作成できず既存Human Approval境界を維持する
  - delegated policyはdelegatedBy、delegatedTo、scopes、source、reason、UTC expiresAt、tokenSha256を必須とし不正値をschemaで拒否する
  - 32 bytes以上のSCWBS_APPROVAL_DELEGATION_TOKENのSHA-256がTask Contractと一致し有効期限内かつ要求scopeが許可された場合だけdelegated approvalを発行する
  - delegated approvalはEvidence subjectHeadCommitとdiffHashを必須としtoken由来HMAC proofを記録するがsecret自体は出力または保存しない
  - consumerはTask policy、scope、Evidence subject、HMAC proofを再検証し手書きYAMLによるtoken迂回を拒否する
  - human-gate scopeはHuman Gate検証だけ、post-finish scopeは全required checks PASS後のcompletionだけに使用でき相互流用できない
  - approvalPolicyをTask authority fieldとしてcreation commit後の追加、mode変更、scope拡張、hash変更をcheck-diffで拒否する
  - metadata-only descendantを含む既存Human Gate scope検証とhuman actor、legacy recordの後方互換性を維持する
  - delegationなし、成功、token欠落、hash不一致、弱いtoken、期限切れ、scope不一致、proof改ざん、authority driftの回帰テストを追加する
  - README、Task Contract、CLI referenceへ安全なenv secret運用、declared provenance、初回Task自己委譲の限界を記載する
evidenceRequired:
