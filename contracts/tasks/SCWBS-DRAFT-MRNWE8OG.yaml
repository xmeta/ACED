  - broad glob・forbidden・Human Gate pathを自動昇格せず、dynamic・unresolved・re-export・alias・cycle・fan-out・budget超過をwideningまたはomittedとして明示する
  - coverage required・missing・unclassifiedとbudget・completenessを既存check-coverage semanticsと矛盾なく返す
  - 同一HEADとTask Contractでbyte-identical、stdoutはparse可能なJSONのみ、既存packet --tinyの互換性と50行制約を維持する
  - Task 234 replayでmanifest bytes・件数・初期読込files/lines/bytes・widening・wall time・決定性を計測し、hard limit・warning・policy enforcementは導入しない
