doneCriteria:
  - approval delegation prepareはexternal environment tokenからsecret-freeなpolicy patchとhandoff summaryを生成しtokenをstdout、stderr、YAML、Evidence、Approval、process argumentsへ出力しない
  - prepareはuncommittedの新規Taskだけを対象にし既存TaskのapprovalPolicyを追加または拡張せず、contract-only creation commitとtask lockを明示する
  - generated policyはdelegatedBy、delegatedTo、scopes、source、reason、UTC expiresAt、tokenSha256を既存schemaで検証しhuman-gateとpost-finishを分離する
  - token未設定、weak token、invalid scope、expiry、schema invalid、authority driftはsecret-free bounded diagnosticでfail-closedになる
  - handoff summaryはsecret injection、policy fingerprint再確認、human-gateとpost-finishのconsumer commandを分離し.envをCLIが自動読込しないことを明示する
  - preparation outputのmanual inputとcommit/finish retry proxyを定義し#179/#215 governance costへの還元を測定可能にする
  - human-only、legacy human、既存delegated approval consumer validationを変更しない
evidenceRequired:
