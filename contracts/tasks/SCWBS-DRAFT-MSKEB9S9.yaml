doneCriteria:
  - Versioned planning-store schema defines store identity, local registry, code-repository reference, workset, and shared Spec reference
  - Read-only `store list/show` commands display resolved store ID and absolute roots and never clone, pull, push, merge, or manage credentials
  - Shared Spec references pin store repository, commit SHA, path, and content hash; missing store, dirty/untrusted root, path escape, commit/hash mismatch, and reference cycles fail closed
  - Store authority remains advisory and cannot expand code-repository Task Contract allowedPaths, forbiddenPaths, Human Gates, required checks, Approval, or Evidence authority
  - Workset status aggregates per-repository Task/Evidence/CI identity without replacing repository-local Ground Truth
  - Store/workset provenance is represented in versioned JSON and becomes stale when the referenced commit or content hash changes
  - CLI shape for setup/register/list/show and `--store <id>` is documented, with setup/register left to normal Git review rather than automatic remote mutation
  - Temporary two-repository and one-store fixtures cover valid reference, stale commit/hash, missing store, path escape, dirty root, cycle, and authority downgrade
  - 'Issue #454 is closed only after protected merge and Task archive'
