doneCriteria:
  - Versioned JSON schema defines the Phase 1 execution plan, implementer result, reviewer result, and local run receipt with explicit role, Task, iteration, head, authority fingerprint, and status fields
  - '`ai execute --task <id> --implementer-command <path> --reviewer-command <path>` runs exactly one Task iteration through declared non-shell adapter commands and rejects missing or unsupported capabilities before mutation'
  - Preflight revalidates the Task Contract, branch, clean working tree, single active Task, authority fingerprint, allowed/forbidden/Human Gate paths, required checks, and active Blocks
  - Implementer input contains only the bounded AI Work Packet and execution context; adapter output is schema-validated and cannot modify Task authority or Human Approval/review records
  - After implementer execution, changed paths are fail-closed checked against allowed, forbidden, and Human Gate paths before required checks run
  - Required checks run through the existing SC-WBS check runner and their receipt is included in the local run receipt; failed checks prevent reviewer dispatch
  - Reviewer runs in a distinct fresh process/context with a separate bounded input and returns approved, changes-requested, or manual-review-required plus machine-readable findings
  - The runner never creates Human Approval, human-only review transitions, pull requests, commits, or merges, and does not implement debugger/retry/resume Phase 2 behavior
  - Unsupported adapter capability, adapter spawn/output failure, stale HEAD, out-of-scope change, active Block, failed check, and reviewer rejection fail closed with a versioned receipt
  - Integration tests cover one-Task isolation, bounded inputs, no-shell invocation, stale/authority/path failures, check failure, fresh reviewer context, reviewer rejection, and no human-transition mutation
  - 'Issue #455 Phase 1 remains open for Phase 2 debugger/retry/resume work and is not closed by this Task'
