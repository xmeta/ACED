doneCriteria:
  - manifest schema v2 stores primaryAgent, all managed agents, and per-file owner/hash entries without losing existing ownership when a second agent is added
  - existing schema v1 manifests migrate only verified managed files to schema v2; custom or divergent files remain untouched and migration is visible in dry-run output
  - init and explicit agent add/set-primary operations keep WBS agent configuration and manifest ownership semantically consistent while preserving legacy primary agent compatibility
  - agent remove deletes only unchanged generated files owned by that agent and never deletes custom or divergent user files
  - update without an explicit agent converges all managed agents, while explicit agent update remains bounded to the selected agent
  - update --dry-run --json reports create, update, unchanged, preserved, divergent, migrate, and remove/move decisions without writing files
  - repeated init, agent operations, migration, and update are idempotent
  - clean consumer fixture covers multi-agent install, update, migration, removal, and upgrade behavior
  - adapter guidance preserves the existing Human Gate and approval boundary semantics
  - 'Complete Issue #507: init/updateの単一agent manifestを複数agent対応へ直し、WBSとのsplit-brainを防ぐ'
