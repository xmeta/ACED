doneCriteria:
  - Common Issue output exposes a versioned remediation envelope that distinguishes command, guidance, and wait actions
  - Command remediation preserves argv boundaries, declares owner and safeToAutoRun, and never encodes an arbitrary shell line as the canonical form
  - Human-only remediation is machine-readable as owner human with safeToAutoRun false; no Approval or Review transition is automated
  - check, health, doctor, check-diff, and finish migrate their primary issue output to the remediation contract while retaining deprecated fixCommand text for compatibility
  - Versioned JSON schemas and CLI documentation define the remediation shape, compatibility policy, and text rendering behavior
  - Regression tests prove guidance is not emitted as an auto-runnable command and Human Gate remediation cannot be owned by AI or auto-run
  - Complete Issue
evidenceRequired:
