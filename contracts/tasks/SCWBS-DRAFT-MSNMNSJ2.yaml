doneCriteria:
  - pull_request CI emits a bounded versioned PR readiness artifact containing repository, PR, head commit, workflow run, Task ID, validate status, next owner, and merge readiness
  - trusted reporter behavior is isolated from untrusted PR execution and never exposes write, approval delegation, or Human Approval authority to the pull_request job
  - reporter provenance validation requires the expected repository, workflow path, workflow run, artifact identity, and PR head before any PR feedback mutation
  - PR feedback is upserted or otherwise bounded per PR and never creates unbounded comments or annotations on every push
  - evidence import command validates repository, PR, head, workflow run, artifact digest, Task subject, and diff provenance before writing tracked Evidence; mismatch and tamper cases fail closed without tracked writes
  - imported CI receipt preserves the exact verified check and artifact provenance and synchronizes Registry atomically with the Evidence update
  - Human Gate and delegated-approval boundaries remain unchanged; no command creates Human Approval or Review records automatically
  - fork and same-repository permission behavior, secret isolation, artifact tampering, head mismatch, workflow mismatch, and bounded feedback are covered by regression tests
  - CLI reference and implementation-gap documentation describe the read-only artifact, trusted reporter, import command, provenance checks, and non-goals
  - all changed implementation paths remain classified and required checks remain derived from classification
  - 'Complete Issue #512: safe PR readiness feedback and verified CI Evidence import'
