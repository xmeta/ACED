acceptanceCriteria:
  - wbs merge-plan accepts base, ours, and theirs as explicit refs or files and emits a versioned deterministic JSON plan
  - node, relation, resource, artifact, and extension identities are compared semantically rather than by JSON line order
  - independent edits are classified clean while same-field edits produce structured conflicts
  - delete-vs-modify, identity collision, duplicate code, missing relation endpoint, and schema-version conflicts fail closed with stable conflict classes
  - the default planner is read-only and never writes contracts/wbs/project.wbs.json or applies a changeset
  - an explicit write option can emit a WJS-compatible changeset only for a clean plan and never resolves an unresolved conflict
  - generated output is reproducible across object key order and formatting-only differences
  - existing direct-edit guard, Human Gate boundary, WJS validation, and changeset apply behavior remain fail-closed
  - representative clean, concurrent-edit, delete-vs-modify, identity-collision, and formatting-only fixtures are covered by integration tests
  - CLI and WBS documentation define inputs, output schema, conflict classes, read-only default, and explicit write/apply boundary
