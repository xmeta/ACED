acceptanceCriteria:
  - doctor --github is explicit opt-in and default doctor remains local-only and non-fatal when GitHub is unavailable
  - capability reporting distinguishes gh missing, unauthenticated, non-GitHub origin, inaccessible repository, read-only capability, partial capability, and ready capability
  - PR read, Actions read, and merge readiness are reported as bounded feature statuses without write calls or admin-scope requirements
  - doctor --json exposes a versioned bounded GitHub capability report and never includes tokens, credentials, raw auth output, or unbounded stderr
  - merge and GitHub Actions metrics unavailable paths guide users to doctor --github without changing local-only behavior
  - origin parsing accepts GitHub SSH and HTTPS forms and explicitly reports non-GitHub origins
  - regression fixtures cover gh missing, unauthenticated, non-GitHub origin, read-only auth, ready, and credential-redaction cases
  - existing Node/npm/Corepack, WJS, registry, WBS, health, and doctor --fix behavior remains intact
  - CLI and getting-started documentation define the opt-in diagnostic, capability meanings, and safe remediation boundary
