doneCriteria:
  - A versioned scwbs.attestation-verification.v1 schema and bounded verifier result distinguish verified, missing, invalid, subject-mismatch, untrusted, and unavailable without storing attestation bodies or key material.
  - evidence verify-attestation --task <id> --artifact <path> --json validates exact artifact digest, Evidence subject binding, repository, signer workflow, predicate, source commit/ref, and freshness; it fails closed when required policy input is unknown.
  - Offline bundle and trusted-root inputs are explicit, never fetched or adopted implicitly, and verification failures cannot relabel existing local provenance as externally verified.
  - Threat model, trust-root/issuer assumptions, fork/untrusted PR boundary, release-vs-PR target, offline material handling, and Human Gate for workflow permission changes are documented.
  - Missing attestation, cryptographic invalidity, identity mismatch, subject mismatch, and unavailable verifier are covered by unit/integration fixtures with bounded machine-readable output.
  - No .github workflow, repository visibility/plan, credential, dependency, release, or trust-root change is made by this Task; those decisions remain Human-only.
