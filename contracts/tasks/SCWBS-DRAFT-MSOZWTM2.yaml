doneCriteria:
  - scwbs serve starts a localhost-only read-only HTTP dashboard with a bounded port option and offline static assets.
  - Dashboard JSON projections reuse the existing ui and trace evaluators and expose task status, next owner/action, Human Gate, Evidence freshness, required checks, trace graph, and open risks without new authority logic.
  - No POST/PUT/PATCH/DELETE or mutation endpoint exists; unknown routes, traversal paths, oversized requests, and remote bind attempts fail closed.
  - Responses are versioned and bounded, secrets/delegation tokens and arbitrary repository file contents are not rendered, and HTML uses CSP plus escaped data rendering.
  - Unit and integration tests cover localhost binding, route allowlist, read-only behavior, bounded output, CSP/XSS/path traversal protections, offline operation, and CLI lifecycle.
  - No package/dependency, workflow, distribution channel, authentication, remote bind, WBS, or authority evaluator change is included in this Task.
