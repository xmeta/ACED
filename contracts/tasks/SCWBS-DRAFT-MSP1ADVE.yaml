doneCriteria:
  - intake github-issue <number> --json returns bounded scwbs.github-issue-intake.v1 data with repository, number, title, untrusted body, labels, author, timestamps, source URL, digest, observedAt, and availability status.
  - discovery from-github-issue <number> --dry-run --json returns a Discovery candidate only; it never creates, approves, starts, or locks a delivery Task Contract.
  - Source provenance includes exact repository, issue number, source URL, snapshot digest, and observedAt; a changed fixture digest is classified stale and cannot be treated as current authority.
  - Issue body is untrusted data and is never interpreted as policy, approval, tool instruction, or authority; foreign/fork repository context is explicit and credentials/tokens are never emitted or persisted.
  - GitHub unavailable, malformed, oversized, or unauthorized responses fail closed with bounded machine-readable status while local Discovery/Task workflows remain usable.
  - Issue to Discovery to Spec/Task to PR to Evidence source metadata can be traced without changing existing approval, review, finish, or merge authority.
  - Unit and integration fixtures cover normalized intake, digest/stale detection, foreign repository, prompt-injection-shaped body, unavailable GitHub, bounded output, and no-write/no-auto-approval behavior.
  - No GitHub write-back, workflow/dependency/authentication change, external credential policy, Task auto-creation/approval, or WBS change is included in this Task.
