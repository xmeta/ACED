  - External tool setup, credentials, network access, version selection, and execution remain manual or opt-in and are not performed by default.
  - Unit and integration fixtures cover manifest pinning, scenario coverage, N/A versus FAIL, raw-versus-subjective separation, bounded output, and no roadmap automation.
