doneCriteria:
  - Locale bundles implement scwbs.locale.v1 with extensible ids, deterministic fallback, bounded messages, and no policy semantics.
  - Agent guidance templates and locale data are separate; existing ja/en meaning is preserved and an additional locale fixture works without a language-union change.
  - Missing keys, invalid placeholders, duplicate keys, unsupported fallback, and malformed bundles fail closed before writes.
  - Stable error codes, JSON schema field names, and machine-readable output remain untranslated and locale-independent.
  - Managed hashes, divergent-file protection, and user-owned translated-file preservation remain effective during update.
  - Selected CLI UX language normalization and fallback are deterministic; full diagnostics translation is not included.
  - Unit and integration tests cover ja/en, additional locale, fallback, placeholder validation, stable JSON fields, and user-owned preservation.
  - No authority, dependency, workflow, WBS, machine-code translation, or locale-specific policy change is included.
