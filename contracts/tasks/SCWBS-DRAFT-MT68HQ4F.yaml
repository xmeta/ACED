doneCriteria:
  - One canonical Approval file can retain independent self-contained human-gate and post-finish facts for the same Task.
  - scopeApprovals is authoritative in v2 and top-level fields are an exact activeScope projection; any projection mismatch invalidates the record.
  - Human Gate selects only human-gate and completion selects only post-finish, with no opposite-scope fallback.
  - Scoped request, approve, reject, and force operations preserve the other scope and reject scope-less writes that could destroy a v2 bundle.
  - Human scoped Approval requires interactive TTY, verified OS actor, and scope-bound exact confirmation; AI cannot create Human Approval.
  - Delegated policy, token, expiry, provenance, and HMAC proof rules remain unchanged and bind the slot key to delegationScope.
  - Legacy v1 human and delegated records remain readable without bulk migration or inferred human scope; explicit v1 delegated scope may be safely imported on a scoped write.
  - Registry continues to index one Approval artifact per Task and failed writer or registry synchronization restores the original file.
  - Unit and integration tests cover schema, projection, both write orders, force isolation, consumer isolation, authority, rollback, and legacy compatibility.
  - Documentation and approval-request JSON schema describe scoped commands and do not expose tokens or unbounded other-scope records.
evidenceRequired:
