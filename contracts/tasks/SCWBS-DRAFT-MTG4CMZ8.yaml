  - bootstrap trust design changes
requiredChecks:
  - test
  - typecheck
  - build
  - test:integration
doneCriteria:
  - default branch definition由来のworkflow_run verifierがscwbs pull_request runの完了後だけ動作し、PR headのcodeやlocal actionをcheckout・実行しない
  - verifierはcontents actions pull-requestsのreadとchecks write以外の権限、secret、delegation tokenを持たない
  - triggering run、repository、PR、base SHA、current head SHAが一意に一致しない場合はworkflow-integrity checkをsuccessにしない
  - control surfaceはworkflow、local action、CI runner script、package/config、merge enforcement実装を明示的に分類する
  - versioned bounded receiptがrepository、PR、base/head、triggering run、trusted workflow pathとSHA-256、control files、manifest digestを記録する
  - workflow-integrity checkはcurrent PR headへ一意にupsertされ、details URLがtrusted verifier runを指す
  - changed file pagination不整合、API failure、曖昧なPR association、stale headはfail closedになる
  - bootstrap PR自身へ新verifierを遡及適用できない制約と、main反映後のPhase B enforcementがIssue closeに必要なことを文書化する
  - workflow security regression testsがpermission、trigger、no-checkout、control surface、bounded receipt、failure boundaryを検証する
evidenceRequired:
  - test-result
  - typecheck-result
  - build-result
  - test:integration-result
  - workflow-security-result
  - human-approval
  - registry-check
