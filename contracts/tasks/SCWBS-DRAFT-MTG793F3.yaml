doneCriteria:
  - current PR diffをGitHub APIから再分類し、merge control surface変更時だけworkflow-integrity receiptを必須にする
  - workflow-integrity checkがmissing、pending、failed、stale、ambiguous、provenance不一致の場合はmerge preflightをfail closedにする
  - receiptのrepository、PR、base/head、control manifest、trusted workflow digest、verifier run、triggering runをcurrent GitHub stateへ再検証する
  - control surface変更時はPR番号から一意に解決したTask EvidenceとHuman Approvalのsubject head、diff hash、PR scope一致を要求する
  - source-only PRは既存のexact-head validate成功経路を維持し、workflow-integrity receiptを要求しない
  - merge preflight JSON schemaと日本語運用文書がworkflow trust status、trusted revision、reason codes、next actionを説明する
  - negative fixtureがvalidate成功だけのcontrol surface PRを拒否し、API failure、pagination、digest、approval境界を回帰検証する
  - Phase B PR上でmain由来verifierのworkflow-integrity checkとartifactをlive smokeし、main反映後の次control PRでenforcementを確認する手順を残す
